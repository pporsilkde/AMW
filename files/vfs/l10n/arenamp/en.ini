archetype.fire_warrior.name = Fire Warrior
archetype.fire_warrior.buff = Emberblade: Strength + Intelligence restore Magicka and add scaling Fire damage to weapon strikes.
archetype.fire_warrior.debuff = Arcane Burden: medium/heavy armour increasingly slows movement and Fatigue recovery.
archetype.crusader.name = Crusader
archetype.crusader.buff = Zeal: Strength + Willpower improve health recovery, spell reliability and resistance to paralysis.
archetype.crusader.debuff = Heavy Doctrine: raw mobility is reduced as the pair grows.
archetype.weaponmaster.name = Weaponmaster
archetype.weaponmaster.buff = Perfect Form: Strength + Agility increase weapon damage and accuracy.
archetype.weaponmaster.debuff = Committed Attack: the offensive stance makes incoming hits more dangerous.
archetype.barbarian.name = Barbarian
archetype.barbarian.buff = Momentum: Strength + Speed grant exceptional melee power and movement speed.
archetype.barbarian.debuff = Impatience: spellcasting becomes less reliable.
archetype.warrior.name = Warrior
archetype.warrior.buff = Bulwark: Strength + Endurance increase carrying capacity and reduce incoming damage.
archetype.warrior.debuff = Weight of Steel: movement speed is slightly reduced.
archetype.knight.name = Knight
archetype.knight.buff = Commanding Presence: Strength + Personality improve weapon damage and disposition.
archetype.knight.debuff = Ceremonial Burden: Fatigue recovers more slowly.
archetype.champion.name = Champion
archetype.champion.buff = Fortune Favours the Bold: Strength + Luck improve damage, accuracy and resistance to paralysis.
